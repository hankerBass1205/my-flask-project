[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project1"
version = "0.1.0"
description = "A standard modern Python project structure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "Flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "test",
]
pythonpath = [
    "src",
]

[tool.ruff]
# Target Python version
target-version = "py312"
# Set line length limits
line-length = 88

[tool.ruff.lint]
# Enable standard check rules:
# E/W: pycodestyle errors and warnings
# F: Pyflakes rules
# I: isort (import sorting)
# N: pep8-naming
# UP: pyupgrade
select = ["E", "F", "I", "N", "UP", "W"]
ignore = []

# Allow autofix for all enabled rules (when using ruff check --fix)
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
