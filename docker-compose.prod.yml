version: "3.9"

# ──────────────────────────────────────────────────────────────
# EC2 生產環境用 Compose
# 不掛載任何憑證 volume，boto3 自動透過 EC2 IAM Role 取得金鑰
# 啟動指令：docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────

services:
  web:
    image: hankbass1205/project1:v3
    container_name: project1_web
    restart: unless-stopped
    ports:
      - "19191:19191"
    environment:
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      # AWS 憑證由 EC2 IAM Role 自動注入，無需任何金鑰設定
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19191/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - project1_net

networks:
  project1_net:
    driver: bridge
