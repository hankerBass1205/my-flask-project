version: "3.9"

# ──────────────────────────────────────────────────────────────
# 本地開發用 Compose（Windows 環境）
# AWS 憑證透過 volume 掛載，金鑰不進入映像檔
# 啟動指令：docker compose up --build
# ──────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: hankbass1205/project1:v3
    container_name: project1_web
    restart: unless-stopped
    ports:
      - "19191:19191"
    environment:
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
    volumes:
      # 🔒 AWS 憑證安全掛載（唯讀）—— 僅本地開發使用
      # EC2 部署請改用 docker-compose.prod.yml（透過 IAM Role 取得憑證）
      - ${USERPROFILE}/.aws:/home/appuser/.aws:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19191/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - project1_net

networks:
  project1_net:
    driver: bridge
