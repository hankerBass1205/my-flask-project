<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CPU 燒機壓測工具，用於觸發 AWS CloudWatch 監控告警測試。">
    <title>Feature 4 - CPU 燒機壓測</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .feat-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            z-index: 1;
            width: 100%;
        }
        .feat-card {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .feat-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            text-align: center;
        }
        .feat-icon-large {
            font-size: 4rem;
            filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.7));
            animation: pulse 2s infinite;
        }
        .feat-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #f87171 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .feat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        /* ── 規格資訊列 ── */
        .spec-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .spec-item {
            flex: 1;
            min-width: 120px;
            background: rgba(239, 68, 68, 0.07);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            text-align: center;
        }
        .spec-label {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }
        .spec-value {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 800;
            color: #f87171;
        }

        /* ── 狀態顯示 ── */
        .status-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #6b7280;
            transition: background 0.3s;
        }
        .status-dot.running {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
            animation: pulse 1s infinite;
        }
        .status-dot.idle {
            background: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
        }
        .status-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--color-text-main);
        }
        .status-sub {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            margin-top: 2px;
        }

        /* ── 持續時間選擇 ── */
        .duration-section {
            margin-bottom: 20px;
        }
        .duration-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-text-main);
            margin-bottom: 10px;
        }
        .duration-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .duration-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.25);
            background: rgba(239, 68, 68, 0.06);
            color: #fca5a5;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .duration-btn:hover,
        .duration-btn.active {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.6);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* ── 主按鈕 ── */
        .btn-stress {
            width: 100%;
            padding: 18px 24px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-family: var(--font-heading);
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 50%, #f97316 100%);
            color: #ffffff;
            box-shadow: 0 4px 28px rgba(239, 68, 68, 0.45);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .btn-stress::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }
        .btn-stress:hover::before { left: 100%; }
        .btn-stress:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 36px rgba(239, 68, 68, 0.6);
        }
        .btn-stress:active { transform: translateY(0); }
        .btn-stress:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        /* ── 進度條 ── */
        .progress-wrap {
            height: 6px;
            border-radius: 6px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #dc2626, #f97316);
            border-radius: 6px;
            transition: width 1s linear;
        }

        /* ── 回應訊息 ── */
        .response-box {
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
            animation: fadeInUp 0.3s ease;
            margin-bottom: 16px;
        }
        .response-box.success {
            display: block;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: #6ee7b7;
        }
        .response-box.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
        }
        .response-box.warning {
            display: block;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fde68a;
        }

        /* ── 返回按鈕 ── */
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--color-text-main);
            padding: 14px 24px;
            font-size: 1rem;
            font-family: var(--font-heading);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            width: 100%;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="feat-container">
        <article class="card feat-card">

            <!-- 標頭 -->
            <div class="feat-header">
                <div class="feat-icon-large">🔥</div>
                <h1 class="feat-title">CPU 燒機壓測</h1>
                <div class="feat-badge">
                    <span class="pulse-dot" style="background-color:#f87171; box-shadow:0 0 8px #f87171;"></span>
                    Background Thread · AWS CloudWatch 監控測試
                </div>
            </div>

            <!-- 規格資訊 -->
            <div class="spec-bar">
                <div class="spec-item">
                    <div class="spec-label">目標 CPU</div>
                    <div class="spec-value">&gt; 60%</div>
                </div>
                <div class="spec-item">
                    <div class="spec-label">預設持續</div>
                    <div class="spec-value">30 秒</div>
                </div>
                <div class="spec-item">
                    <div class="spec-label">執行模式</div>
                    <div class="spec-value" style="font-size:0.9rem;">背景執行緒</div>
                </div>
            </div>

            <!-- 目前狀態 -->
            <div class="status-panel" id="status-panel">
                <div class="status-dot {% if stress_status.running %}running{% else %}idle{% endif %}" id="status-dot"></div>
                <div>
                    <div class="status-text" id="status-text">
                        {% if stress_status.running %}🔥 燒機執行中...{% else %}✅ 系統閒置，等待指令{% endif %}
                    </div>
                    <div class="status-sub" id="status-sub">
                        {% if stress_status.running %}
                            Flask 主執行緒不受影響，其他功能仍可正常使用
                        {% else %}
                            點擊下方按鈕啟動 CPU 壓測，觸發 AWS CloudWatch 告警
                        {% endif %}
                    </div>
                </div>
            </div>

            <!-- 持續時間選擇 -->
            <div class="duration-section">
                <label class="duration-label">選擇燒機持續時間</label>
                <div class="duration-options">
                    <button class="duration-btn" data-duration="15">15 秒</button>
                    <button class="duration-btn active" data-duration="30">30 秒</button>
                    <button class="duration-btn" data-duration="60">60 秒</button>
                    <button class="duration-btn" data-duration="120">120 秒</button>
                </div>
            </div>

            <!-- 進度條 -->
            <div class="progress-wrap" id="progress-wrap">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <!-- 回應訊息 -->
            <div class="response-box" id="response-box"></div>

            <!-- 燒機按鈕 -->
            <button class="btn-stress" id="btn-stress"
                {% if stress_status.running %}disabled{% endif %}>
                <span id="btn-icon">🔥</span>
                <span id="btn-text">{% if stress_status.running %}燒機執行中...{% else %}開始燒機{% endif %}</span>
            </button>

            <!-- 返回首頁 -->
            <a href="/" class="btn-secondary">← 返回儀表板首頁</a>
        </article>
    </div>

    <script>
        const btnStress = document.getElementById('btn-stress');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const statusSub = document.getElementById('status-sub');
        const responseBox = document.getElementById('response-box');
        const progressWrap = document.getElementById('progress-wrap');
        const progressFill = document.getElementById('progress-fill');

        let selectedDuration = 30;
        let countdownTimer = null;

        // ── 持續時間選擇 ──
        document.querySelectorAll('.duration-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDuration = parseInt(btn.dataset.duration);
            });
        });

        // ── 設定執行中 UI ──
        function setRunningUI(duration) {
            btnStress.disabled = true;
            btnText.textContent = '燒機執行中...';
            btnIcon.textContent = '⏳';
            statusDot.className = 'status-dot running';
            statusText.textContent = '🔥 燒機執行中...';
            statusSub.textContent = 'Flask 主執行緒不受影響，其他功能仍可正常使用';
            progressWrap.style.display = 'block';
            progressFill.style.width = '0%';

            // 倒數進度條
            let elapsed = 0;
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                elapsed += 1;
                const pct = Math.min((elapsed / duration) * 100, 100);
                progressFill.style.width = pct + '%';
                if (elapsed >= duration) {
                    clearInterval(countdownTimer);
                    setIdleUI();
                }
            }, 1000);
        }

        // ── 設定閒置 UI ──
        function setIdleUI() {
            btnStress.disabled = false;
            btnText.textContent = '開始燒機';
            btnIcon.textContent = '🔥';
            statusDot.className = 'status-dot idle';
            statusText.textContent = '✅ 燒機完成，系統恢復閒置';
            statusSub.textContent = '可再次點擊按鈕進行下一輪壓測';
            progressWrap.style.display = 'none';
            progressFill.style.width = '0%';
        }

        // ── 顯示回應訊息 ──
        function showResponse(type, message) {
            responseBox.className = 'response-box ' + type;
            responseBox.textContent = message;
        }

        // ── 點擊燒機按鈕 ──
        btnStress.addEventListener('click', async () => {
            btnStress.disabled = true;
            showResponse('', '');
            responseBox.className = 'response-box';

            try {
                const res = await fetch('/api/stress/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: selectedDuration })
                });
                const data = await res.json();

                if (res.status === 409) {
                    // 已在執行中
                    showResponse('warning', '⚠️ ' + data.message);
                    setRunningUI(selectedDuration);
                } else if (res.ok && data.started) {
                    showResponse('success', '✅ ' + data.message);
                    setRunningUI(selectedDuration);
                } else {
                    showResponse('error', '❌ ' + (data.message || '啟動失敗'));
                    btnStress.disabled = false;
                }
            } catch (err) {
                showResponse('error', '❌ 網路錯誤：' + err.message);
                btnStress.disabled = false;
            }
        });
    </script>
</body>
</html>
